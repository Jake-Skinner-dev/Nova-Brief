name: Rebuild Nova Brief pages

# Keeps dist/ (one static page per published article, plus section pages,
# sitemap.xml and rss.xml — see scripts/generate-articles.mjs) in sync
# with Supabase, so publishing/editing in the admin doesn't need someone
# to run `npm run build` by hand.
#
# Fires two ways:
#  - repository_dispatch "brief-published": pushed the instant an article's
#    status becomes 'published', by a Supabase trigger (see
#    supabase/notify-publish.sql) so new content rebuilds within seconds
#    instead of waiting on the schedule below.
#  - schedule: a safety net. GitHub deprioritises cron on quiet repos, so
#    in practice this runs every few hours rather than every 30 minutes —
#    it exists to catch anything the trigger missed, not as the primary path.
#
# This does NOT reach the live cPanel subdomain on its own — either click
# "Update from Remote" + "Deploy HEAD Commit" in cPanel Git Version
# Control, or add a cPanel Cron Job that pulls + copies dist/ into the
# document root on a tight schedule (see brief/README.md → Deploy).
#
# Delete this file to turn the automation off; the manual
# build / commit / deploy flow still works.
on:
  repository_dispatch:
    types: [brief-published]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Commit and push if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No Nova Brief content changes — nothing to publish."
          else
            git commit -m "Auto-publish: rebuild Nova Brief pages from Supabase"
            git push
          fi
