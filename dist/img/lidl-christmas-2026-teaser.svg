<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" fill="none" aria-label="A wrapped gift with a teaser play badge and an early calendar, for Lidl's early Christmas advert teaser">
  <rect width="1200" height="675" fill="#FDEDE1"/>
  <rect x="44" y="44" width="56" height="6" rx="3" fill="#B4652F"/>

  <!-- calendar showing 'early' -->
  <g transform="translate(150 210)">
    <rect x="0" y="20" width="200" height="180" rx="16" fill="#FBFAF7" stroke="#14141A" stroke-width="8"/>
    <rect x="0" y="20" width="200" height="46" rx="16" fill="#0050AA"/>
    <line x1="46" y1="4" x2="46" y2="40" stroke="#14141A" stroke-width="10" stroke-linecap="round"/>
    <line x1="154" y1="4" x2="154" y2="40" stroke="#14141A" stroke-width="10" stroke-linecap="round"/>
    <text x="100" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#B4652F">SEP</text>
  </g>

  <!-- wrapped gift -->
  <g transform="translate(520 240)">
    <rect x="0" y="70" width="320" height="270" rx="14" fill="#0050AA" stroke="#14141A" stroke-width="9"/>
    <rect x="138" y="70" width="46" height="270" fill="#FEBE98"/>
    <rect x="0" y="182" width="320" height="46" fill="#FEBE98"/>
    <path d="M161 70 C 161 6 92 -2 92 40 C 92 70 132 70 161 70 C 190 70 230 70 230 40 C 230 -2 161 6 161 70 Z" fill="#FEBE98" stroke="#14141A" stroke-width="9" stroke-linejoin="round"/>
  </g>

  <!-- teaser play badge -->
  <g transform="translate(960 180)">
    <circle r="78" fill="#B4652F" stroke="#FBFAF7" stroke-width="9"/>
    <path d="M-24 -36 L40 0 L-24 36 Z" fill="#FBFAF7"/>
  </g>
  <text x="960" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" letter-spacing="2" fill="#14141A">TEASER</text>

  <!-- snowflake -->
  <g transform="translate(415 480)" stroke="#0050AA" stroke-width="9" stroke-linecap="round">
    <line x1="0" y1="-44" x2="0" y2="44"/><line x1="-38" y1="-22" x2="38" y2="22"/><line x1="-38" y1="22" x2="38" y2="-22"/>
  </g>

  <text x="44" y="636" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#14141A">Nova <tspan fill="#B4652F">Brief</tspan></text>
</svg>
