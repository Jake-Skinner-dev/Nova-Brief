---
# cPanel Git Version Control deployment file for Nova Brief (standalone repo).
#
#   Clone URL       : https://github.com/Jake-Skinner-dev/Nova-Brief.git
#   Repository Path  : /home/o5l9nmc9gw7j/repositories/Nova-Brief  (the git
#                      checkout; .cpanel.yml runs from here)
#   DEPLOYPATH below : the document root the web server serves for
#                      brief.novasocial.co.uk
#
# Copies the pre-built dist/ folder into that document root and never
# deletes anything already there.
deployment:
  tasks:
    - export DEPLOYPATH=/home/o5l9nmc9gw7j/public_html/brief.novasocial.co.uk
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R dist/. $DEPLOYPATH/
    # dist/ already contains .htaccess (copied from public/ at build); re-copy
    # explicitly as a belt-and-braces in case Vite skipped the dotfile.
    - /bin/cp public/.htaccess $DEPLOYPATH/.htaccess || true
