<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" fill="none" aria-label="A shopping trolley riding a rising wave of ascending bars, for retail media's second wave reaching brand budgets">
  <rect width="1200" height="675" fill="#E0F0EE"/>
  <rect x="44" y="44" width="56" height="6" rx="3" fill="#2F8F8A"/>

  <!-- rising bars -->
  <g fill="#BEE0DC">
    <rect x="150" y="420" width="120" height="150" rx="8"/>
    <rect x="300" y="350" width="120" height="220" rx="8"/>
    <rect x="450" y="270" width="120" height="300" rx="8"/>
    <rect x="600" y="190" width="120" height="380" rx="8"/>
    <rect x="750" y="120" width="120" height="450" rx="8"/>
  </g>
  <path d="M150 420 L360 350 L510 270 L660 190 L900 120" stroke="#2F8F8A" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wave -->
  <path d="M-20 470 C 200 420 320 540 560 500 C 820 456 940 560 1240 500 L1240 700 L-20 700 Z" fill="#2F8F8A" opacity="0.16"/>
  <path d="M-20 470 C 200 420 320 540 560 500 C 820 456 940 560 1240 500" stroke="#2F8F8A" stroke-width="6" fill="none" opacity="0.5"/>

  <!-- trolley -->
  <g transform="translate(470 250)" stroke="#14141A" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-40 -30 H-8 L20 90 H150 L182 6 H6"/>
    <circle cx="34" cy="128" r="16" fill="#FEBE98"/>
    <circle cx="132" cy="128" r="16" fill="#FEBE98"/>
    <line x1="30" y1="10" x2="40" y2="66"/><line x1="78" y1="10" x2="82" y2="66"/><line x1="126" y1="10" x2="124" y2="66"/>
  </g>

  <text x="44" y="636" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#14141A">Nova <tspan fill="#B4652F">Brief</tspan></text>
</svg>
